<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provide Food - Plate2Plate</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/globals.css">
  <style>
    .page-header {
      background: var(--primary-light);
      padding: var(--space-2xl) 0;
      margin-bottom: var(--space-2xl);
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
      border-bottom: 2px solid var(--border);
    }

    .tab {
      padding: var(--space-sm) var(--space-lg);
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--transition-normal);
      background: none;
      border: none;
      cursor: pointer;
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn var(--transition-normal) forwards;
    }

    .donation-card {
      border-left: 4px solid var(--primary);
      transition: transform var(--transition-fast);
    }

    .donation-card.reserved {
      border-left-color: #f59e0b;
    }

    .donation-card.completed {
      border-left-color: var(--success);
    }

    .badge {
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-available {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-reserved {
      background: #fef9c3;
      color: #854d0e;
    }

    .badge-completed {
      background: #dcfce7;
      color: #166534;
    }

    .verification-box {
      background: var(--background);
      padding: var(--space-md);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      margin-top: var(--space-md);
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="container flex items-center justify-between">
      <a href="/dashboard.html" class="flex items-center gap-sm">
        <img src="/logo.svg" alt="Logo" width="32" height="32">
        <span
          style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.25rem; color: var(--primary);">Plate2Plate</span>
      </a>
      <div class="flex items-center gap-md">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/receiver.html" class="nav-link">Find Food</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1 style="font-family: 'Sora', sans-serif; margin-bottom: var(--space-xs);">Food Provider Portal</h1>
      <p style="color: var(--text-muted);">Share surplus food with the campus community.</p>
    </div>
  </header>

  <main class="container" style="padding-bottom: var(--space-2xl);">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('publish')">Publish Donation</button>
      <button class="tab" onclick="switchTab('history')">My Donations</button>
    </div>

    <!-- Publish Tab -->
    <div id="publish-tab" class="tab-content active">
      <div class="card" style="max-width: 800px; margin: 0 auto;">
        <h2 style="margin-bottom: var(--space-lg);">New Donation Listing</h2>
        <form id="donation-form">
          <div class="grid grid-cols-2 gap-md">
            <div class="form-group">
              <label class="form-label">Food Category *</label>
              <select id="foodCategory" name="foodCategory" class="form-input" required>
                <option value="">Select category</option>
                <option value="raw">Raw</option>
                <option value="packaged">Packaged</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Food Name *</label>
              <input id="foodName" name="foodName" class="form-input" placeholder="Rice, Biscuits, etc." required />
            </div>
          </div>

          <div class="grid grid-cols-3 gap-md">
            <div class="form-group">
              <label class="form-label">Quantity *</label>
              <input id="quantity" name="quantity" type="number" step="0.1" class="form-input" required />
            </div>
            <div class="form-group">
              <label class="form-label">Unit *</label>
              <select id="unit" name="unit" class="form-input" required>
                <option value="kg">Kg</option>
                <option value="liters">Liters</option>
                <option value="packets">Packets</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Expiry Date *</label>
              <input id="expiryDate" name="expiryDate" type="date" class="form-input" required />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-md">
            <div class="form-group">
              <label class="form-label">Storage Type *</label>
              <select id="storageType" name="storageType" class="form-input" required>
                <option value="ambient">Ambient</option>
                <option value="refrigerated">Refrigerated</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Condition *</label>
              <select id="condition" name="condition" class="form-input" required>
                <option value="sealed">Sealed</option>
                <option value="loose">Loose</option>
                <option value="fresh">Fresh</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-md">
            <div class="form-group">
              <label class="form-label">Pickup Start Date *</label>
              <input id="pickupStartDate" name="pickupStartDate" type="date" class="form-input" required />
            </div>
            <div class="form-group">
              <label class="form-label">Pickup End Date *</label>
              <input id="pickupEndDate" name="pickupEndDate" type="date" class="form-input" required />
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Publish Donation</button>
        </form>
      </div>
    </div>

    <!-- History Tab -->
    <div id="history-tab" class="tab-content">
      <div id="my-donations" class="flex flex-col gap-md">
        <!-- Populated by JS -->
        <div class="card text-center" style="padding: var(--space-2xl); color: var(--text-muted);">
          <p>Loading your donation history...</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <p>© 2026 Plate2Plate • Built for a sustainable campus</p>
    </div>
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem('plate2plate_user'));
    if (!user) window.location.href = '/auth.html';

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'publish') {
        document.querySelector('[onclick="switchTab(\'publish\')"]').classList.add('active');
        document.getElementById('publish-tab').classList.add('active');
      } else {
        document.querySelector('[onclick="switchTab(\'history\')"]').classList.add('active');
        document.getElementById('history-tab').classList.add('active');
        loadMyDonations();
      }
    }

    async function loadMyDonations() {
      const container = document.getElementById('my-donations');
      try {
        const res = await fetch("/api/donations/my-donations", {
          headers: { "x-user-id": user.email }
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Failed to load");
        if (data.length === 0) {
          container.innerHTML = '<div class="card text-center"><p>You haven\'t published any donations yet.</p></div>';
          return;
        }

        container.innerHTML = data.map(d => {
          const isReserved = d.status === "reserved";
          const isCompleted = d.status === "completed";
          const badgeClass = isCompleted ? 'badge-completed' : (isReserved ? 'badge-reserved' : 'badge-available');

          return `
                        <div class="card donation-card ${isReserved ? 'reserved' : ''} ${isCompleted ? 'completed' : ''}">
                            <div class="flex justify-between items-start" style="margin-bottom: var(--space-md);">
                                <div>
                                    <h3 style="margin: 0;">${d.foodName}</h3>
                                    <span style="font-size: 0.8125rem; color: var(--text-muted);">${d.foodCategory} • ${d.quantity} ${d.unit}</span>
                                </div>
                                <span class="badge ${badgeClass}">${d.status}</span>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-md" style="font-size: 0.875rem;">
                                <div>
                                    <p><b>Storage:</b> ${d.storageType}</p>
                                    <p><b>Condition:</b> ${d.condition}</p>
                                </div>
                                <div>
                                    <p><b>Expires:</b> ${new Date(d.expiryDate).toLocaleDateString()}</p>
                                    <p><b>Pickup By:</b> ${new Date(d.pickupEndDate).toLocaleDateString()}</p>
                                </div>
                            </div>

                            ${isReserved ? `
                                <div class="verification-box">
                                    <p style="font-weight: 700; margin-bottom: var(--space-sm);">Verify Collection Code</p>
                                    <div class="flex gap-sm">
                                        <input type="text" id="code-${d._id}" class="form-input" placeholder="4-digit code" maxlength="4" style="width: 140px; text-align: center;">
                                        <button onclick="completeDonation('${d._id}')" class="btn btn-primary" style="padding: 0.5rem 1.5rem;">Verify</button>
                                    </div>
                                    <p id="error-${d._id}" style="color: var(--error); font-size: 0.75rem; margin-top: 0.5rem; display: none;"></p>
                                </div>
                            ` : ''}
                            
                            ${isCompleted ? `
                                <div style="margin-top: var(--space-md); color: var(--success); font-weight: 700; display: flex; align-items: center; gap: 0.5rem;">
                                    <span>✓</span> Verified and Distributed
                                </div>
                            ` : ''}
                        </div>
                    `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="card text-center" style="color: var(--error);"><p>${err.message}</p></div>`;
      }
    }

    async function completeDonation(id) {
      const codeInput = document.getElementById(`code-${id}`);
      const errorEl = document.getElementById(`error-${id}`);
      const code = codeInput.value.trim();

      if (!code || code.length !== 4) {
        errorEl.textContent = "Enter 4-digit code";
        errorEl.style.display = "block";
        return;
      }

      try {
        const res = await fetch(`/api/donations/${id}/complete`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-user-id": user.email
          },
          body: JSON.stringify({ code })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to complete");

        alert("Donation completed! Thank you for sharing. 🎉");
        loadMyDonations();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    }

    document.getElementById("donation-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Publishing...';

      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      data.donorContact = user.phone || "";
      data.donorAddress = user.address || "";

      try {
        const res = await fetch("/api/donations", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-user-id": user.email
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || "Failed");

        alert("Donation published successfully! 🥗");
        e.target.reset();
        switchTab('history');
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Publish Donation';
      }
    });
  </script>
</body>

</html>
