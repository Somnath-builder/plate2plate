<svg width="220" height="144" viewBox="0 0 220 144" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar outline -->
  <rect x="40" y="30" width="140" height="100" rx="8" fill="#FFFFFF" stroke="#0F9D58" stroke-width="4"/>
  
  <!-- Calendar header -->
  <rect x="40" y="30" width="140" height="24" rx="8" fill="#0F9D58"/>
  
  <!-- Calendar tabs -->
  <rect x="50" y="20" width="8" height="20" rx="2" fill="#0F9D58"/>
  <rect x="162" y="20" width="8" height="20" rx="2" fill="#0F9D58"/>
  
  <!-- Calendar grid lines -->
  <line x1="40" y1="78" x2="180" y2="78" stroke="#0F9D58" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="40" y1="102" x2="180" y2="102" stroke="#0F9D58" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="73" y1="54" x2="73" y2="130" stroke="#0F9D58" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="106" y1="54" x2="106" y2="130" stroke="#0F9D58" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="139" y1="54" x2="139" y2="130" stroke="#0F9D58" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Event indicators -->
  <rect x="50" y="60" width="18" height="12" rx="4" fill="#E6F4EA" stroke="#0F9D58" stroke-width="2"/>
  <rect x="112" y="60" width="18" height="12" rx="4" fill="#E6F4EA" stroke="#0F9D58" stroke-width="2"/>
  <rect x="80" y="84" width="18" height="12" rx="4" fill="#E6F4EA" stroke="#0F9D58" stroke-width="2"/>
  <rect x="145" y="84" width="18" height="12" rx="4" fill="#E6F4EA" stroke="#0F9D58" stroke-width="2"/>
  <rect x="50" y="108" width="18" height="12" rx="4" fill="#E6F4EA" stroke="#0F9D58" stroke-width="2"/>
  
  <!-- Current day highlight -->
  <circle cx="123" cy="115" r="10" fill="#0F9D58" fill-opacity="0.2" stroke="#0F9D58" stroke-width="2"/>
</svg>

