<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - Plate2Plate</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/globals.css">
  <script>
    (function () {
      const theme = localStorage.getItem('plate2plate_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <script src="/theme.js" defer></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--surface) 100%);
      transition: background-color var(--transition-normal);
    }

    body::before {
      display: none !important;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      animation: fadeIn var(--transition-normal) forwards;
    }

    .tabs {
      display: flex;
      margin-bottom: var(--space-lg);
      border-bottom: 2px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: var(--space-md);
      text-align: center;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--transition-normal);
      background: none;
      border: none;
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
      animation: fadeIn var(--transition-fast) forwards;
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .auth-logo {
      margin: 0 auto var(--space-md);
    }
  </style>
</head>

<body>
  <div class="auth-card card">
    <div class="auth-header">
      <div id="theme-toggle-container" style="position: absolute; top: var(--space-md); right: var(--space-md);"></div>
      <a href="/" class="auth-logo flex items-center justify-center gap-sm">
        <img src="/logo.svg" alt="Logo" width="48" height="48">
        <span
          style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.75rem; color: var(--primary);">Plate2Plate</span>
      </a>
      <p style="color: var(--text-muted);">Every Plate Matters. Join the movement.</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="signup">Sign Up</button>
    </div>

    <div id="login-form" class="form-section active">
      <form id="login-form-element">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" class="form-input" required placeholder="name@gmail.com">
        </div>
        <div class="form-group">
          <div class="flex justify-between items-center" style="margin-bottom: var(--space-xs);">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <a href="#" class="nav-link" style="font-size: 0.75rem;"
              onclick="alert('Contact support to reset your password')">Forgot?</a>
          </div>
          <input type="password" id="login-password" name="password" class="form-input" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;" id="login-btn">Sign In</button>
      </form>
    </div>

    <div id="signup-form" class="form-section">
      <form id="signup-form-element">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input type="text" id="signup-name" name="name" class="form-input" required placeholder="Full name">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input type="email" id="signup-email" name="email" class="form-input" required placeholder="name@gmail.com">
        </div>
        <div class="grid grid-cols-2 gap-md">
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" class="form-input" required
              placeholder="••••••••">
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-confirm-password">Confirm</label>
            <input type="password" id="signup-confirm-password" name="confirmPassword" class="form-input" required
              placeholder="••••••••">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-address">Address</label>
          <input type="text" id="signup-address" name="address" class="form-input" required
            placeholder="Campus Block / Street">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-phone">Phone Number</label>
          <input type="tel" id="signup-phone" name="phone" class="form-input" required placeholder="+91 1234567890">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;" id="signup-btn">Create Account</button>
      </form>
    </div>

    <div id="error-message"
      style="color: var(--error); font-size: 0.875rem; margin-top: var(--space-md); text-align: center; display: none;">
    </div>
    <div id="success-message"
      style="color: var(--success); font-size: 0.875rem; margin-top: var(--space-md); text-align: center; display: none;">
    </div>
  </div>

  <script>
    // Tabs logic
    const tabs = document.querySelectorAll('.tab');
    const formSections = document.querySelectorAll('.form-section');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetTab = tab.dataset.tab;
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        formSections.forEach(section => {
          section.classList.remove('active');
          if (section.id === `${targetTab}-form`) section.classList.add('active');
        });
        hideMessages();
      });
    });

    const loginForm = document.getElementById('login-form-element');
    const signupForm = document.getElementById('signup-form-element');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.style.display = 'block';
      successMessage.style.display = 'none';
    }

    function showSuccess(msg) {
      successMessage.textContent = msg;
      successMessage.style.display = 'block';
      errorMessage.style.display = 'none';
    }

    function hideMessages() {
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
    }

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      const fd = new FormData(signupForm);
      const user = Object.fromEntries(fd.entries());

      if (user.password !== user.confirmPassword) {
        return showError('Passwords do not match');
      }
      if (user.password.length < 6) {
        return showError('Password must be at least 6 characters');
      }

      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account...';

      try {
        const users = JSON.parse(localStorage.getItem('plate2plate_users') || '[]');
        if (users.find(u => u.email.toLowerCase() === user.email.toLowerCase())) {
          return showError('Email already registered');
        }

        users.push({ ...user, createdAt: Date.now() });
        localStorage.setItem('plate2plate_users', JSON.stringify(users));
        localStorage.setItem('plate2plate_user', JSON.stringify({
          name: user.name,
          email: user.email,
          address: user.address,
          phone: user.phone,
          loginTime: Date.now()
        }));

        showSuccess('Welcome to Plate2Plate! Redirecting...');
        setTimeout(() => window.location.href = '/dashboard.html', 1500);
      } finally {
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
      }
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      hideMessages();
      const fd = new FormData(loginForm);
      const { email, password } = Object.fromEntries(fd.entries());

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      const users = JSON.parse(localStorage.getItem('plate2plate_users') || '[]');
      const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

      if (!user) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        return showError('Invalid email or password');
      }

      localStorage.setItem('plate2plate_user', JSON.stringify({
        name: user.name,
        email: user.email,
        address: user.address,
        phone: user.phone,
        loginTime: Date.now()
      }));

      showSuccess('Success! Redirecting...');
      setTimeout(() => window.location.href = '/dashboard.html', 1000);
    });

    window.addEventListener('load', () => {
      if (localStorage.getItem('plate2plate_user')) {
        window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>

</html>
