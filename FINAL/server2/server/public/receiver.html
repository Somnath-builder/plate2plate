<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Food - Plate2Plate</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/globals.css">
  <script>
    (function () {
      const theme = localStorage.getItem('plate2plate_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <script src="/theme.js" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    .page-header {
      background: var(--secondary);
      color: white;
      padding: var(--space-2xl) 0;
      margin-bottom: var(--space-2xl);
      border-bottom: none;
    }

    .tabs {
      display: flex;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
      border-bottom: 2px solid var(--border);
    }

    .tab {
      padding: var(--space-sm) var(--space-lg);
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--transition-normal);
      background: none;
      border: none;
      cursor: pointer;
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn var(--transition-normal) forwards;
    }

    .donation-card {
      border-top: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .donation-card.reserved-item {
      border-top-color: var(--secondary);
    }

    .donation-card.completed-item {
      border-top-color: var(--success);
    }

    .badge {
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-available {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-reserved {
      background: #fef9c3;
      color: #854d0e;
    }

    .badge-completed {
      background: #dcfce7;
      color: #166534;
    }

    .pickup-code-box {
      background: var(--primary-light);
      padding: var(--space-md);
      border-radius: var(--radius-lg);
      border: 2px dashed var(--primary);
      text-align: center;
      margin-top: var(--space-sm);
    }

    .code-display {
      font-family: 'Sora', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.25em;
      margin: var(--space-xs) 0;
    }

    /* Map Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: var(--surface);
      width: 90%;
      max-width: 600px;
      border-radius: var(--radius-xl);
      padding: var(--space-lg);
      position: relative;
      box-shadow: var(--shadow-xl);
    }

    #view-map {
      height: 400px;
      width: 100%;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .close-modal {
      position: absolute;
      top: var(--space-md);
      right: var(--space-md);
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
      z-index: 1010;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="container flex items-center justify-between">
      <a href="/dashboard.html" class="flex items-center gap-sm">
        <img src="/logo.svg" alt="Logo" width="32" height="32">
        <span
          style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.25rem; color: var(--primary);">Plate2Plate</span>
      </a>
      <div class="flex items-center gap-md">
        <div id="theme-toggle-container"></div>
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/provider.html" class="nav-link">Share Food</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1 style="font-family: 'Sora', sans-serif; margin-bottom: var(--space-xs); color: white;">Find Available Food
      </h1>
      <p style="color: rgba(255,255,255,0.8);">Browse current redistribution listings near you.</p>
    </div>
  </header>

  <main class="container" style="padding-bottom: var(--space-2xl);">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('available')">Available Feed</button>
      <button class="tab" onclick="switchTab('reservations')">My Reservations</button>
    </div>

    <!-- Available Tab -->
    <div id="available-tab" class="tab-content active">
      <div id="donations-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg">
        <!-- Populated by JS -->
        <div class="card text-center" style="grid-column: 1/-1; padding: var(--space-2xl); color: var(--text-muted);">
          <p>Scanning for available food...</p>
        </div>
      </div>
    </div>

    <!-- Reservations Tab -->
    <div id="reservations-tab" class="tab-content">
      <div id="my-reservations" class="flex flex-col gap-md">
        <!-- Populated by JS -->
        <div class="card text-center" style="padding: var(--space-2xl); color: var(--text-muted);">
          <p>Loading your reservations...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Map Modal -->
  <div id="map-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="closeMap()">×</button>
      <h3 style="margin-bottom: var(--space-md);">Pickup Location</h3>
      <div id="view-map"></div>
      <div style="margin-top: var(--space-md); display: flex; justify-content: flex-end;">
        <button class="btn btn-secondary" onclick="closeMap()">Close</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="container text-center">
      <p>© 2026 Plate2Plate • Built for a sustainable campus</p>
    </div>
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem('plate2plate_user'));
    if (!user) window.location.href = '/auth.html';

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'available') {
        document.querySelector('[onclick="switchTab(\'available\')"]').classList.add('active');
        document.getElementById('available-tab').classList.add('active');
        loadDonations();
      } else {
        document.querySelector('[onclick="switchTab(\'reservations\')"]').classList.add('active');
        document.getElementById('reservations-tab').classList.add('active');
        loadReservations();
      }
    }

    async function loadDonations() {
      const grid = document.getElementById('donations-grid');
      try {
        const res = await fetch("/api/donations");
        const data = await res.json();

        if (!data.length) {
          grid.innerHTML = '<div class="card text-center" style="grid-column: 1/-1;"><p>Everything is currently shared! Check back later. 🥗</p></div>';
          return;
        }

        grid.innerHTML = data.map(d => `
                    <div class="card donation-card">
                        <div class="flex justify-between items-start">
                            <h3 style="margin: 0;">${d.foodName}</h3>
                            <span class="badge badge-available">Available</span>
                        </div>
                        <div style="font-size: 0.875rem; color: var(--text-muted);">
                            <p><b>Category:</b> ${d.foodCategory}</p>
                            <p><b>Quantity:</b> ${d.quantity} ${d.unit}</p>
                            <p><b>Expires:</b> ${new Date(d.expiryDate).toLocaleDateString()}</p>
                        </div>
                        <div style="margin-top: auto; padding-top: var(--space-sm); border-top: 1px solid var(--border);">
                            <p style="font-size: 0.8125rem; color: var(--text-muted); margin-bottom: var(--space-sm);">
                                📍 ${d.pickupLocation || d.donorAddress || 'Local Campus Pickup'}
                            </p>
                            <button onclick="reserveDonation('${d._id}')" class="btn btn-primary" style="width: 100%;">Reserve for Pickup</button>
                            ${d.latitude ? `<button onclick="viewOnMap(${d.latitude}, ${d.longitude}, '${d.foodName.replace(/'/g, "\\'")}')" class="btn btn-secondary" style="width: 100%; margin-top: var(--space-xs); display: flex; align-items: center; justify-content: center; gap: 0.5rem;"><span>🗺️</span> View on Map</button>` : ''}
                        </div>
                    </div>
                `).join('');
      } catch (err) {
        grid.innerHTML = '<div class="card text-center" style="grid-column: 1/-1; color: var(--error);"><p>Failed to connect to feed.</p></div>';
      }
    }

    async function loadReservations() {
      const container = document.getElementById('my-reservations');
      try {
        const res = await fetch("/api/donations/reservations", {
          headers: { "x-user-id": user.email }
        });
        const data = await res.json();

        if (data.length === 0) {
          container.innerHTML = '<div class="card text-center"><p>You haven\'t reserved anything yet. Go browse the feed!</p></div>';
          return;
        }

        container.innerHTML = data.map(d => {
          const isCompleted = d.status === "completed";
          return `
                        <div class="card donation-card ${isCompleted ? 'completed-item' : 'reserved-item'}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 style="margin: 0;">${d.foodName}</h3>
                                    <span style="font-size: 0.875rem; color: var(--text-muted);">${d.quantity} ${d.unit} • ${d.foodCategory}</span>
                                </div>
                                <span class="badge ${isCompleted ? 'badge-completed' : 'badge-reserved'}">${d.status}</span>
                            </div>

                            <div class="grid grid-cols-2 gap-md" style="font-size: 0.875rem;">
                                <div>
                                    <p><b>Pickup From:</b> ${d.pickupLocation || d.donorAddress || 'Confirmed Location'}</p>
                                    <p><b>Contact:</b> ${d.donorContact || 'See provider'}</p>
                                </div>
                                <div>
                                    <p><b>Pickup By:</b> ${new Date(d.pickupEndDate).toLocaleString()}</p>
                                    ${d.latitude ? `<button onclick="viewOnMap(${d.latitude}, ${d.longitude}, '${d.foodName.replace(/'/g, "\\'")}')" class="btn btn-secondary" style="margin-top: var(--space-sm); padding: 0.5rem 1rem; font-size: 0.75rem;">🗺️ View Location</button>` : ''}
                                </div>
                            </div>

                            ${!isCompleted ? `
                                <div class="pickup-code-box">
                                    <p style="font-size: 0.8125rem; font-weight: 600; text-transform: uppercase;">Your Pickup Code</p>
                                    <div class="code-display">${d.code || '----'}</div>
                                    <p style="font-size: 0.75rem; color: var(--text-muted);">Show this code to the provider to verify pickup.</p>
                                </div>
                            ` : `
                                <div style="color: var(--success); font-weight: 700; display: flex; align-items: center; gap: 0.5rem; margin-top: var(--space-sm);">
                                    <span>✓</span> Pickup Completed Successfully
                                </div>
                            `}
                        </div>
                    `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<div class="card text-center" style="color: var(--error);"><p>Error loading reservations.</p></div>';
      }
    }

    let viewMap, viewMarker;
    function viewOnMap(lat, lng, title) {
      document.getElementById('map-modal').style.display = 'flex';

      if (!viewMap) {
        viewMap = L.map('view-map').setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors'
        }).addTo(viewMap);
        viewMarker = L.marker([lat, lng]).addTo(viewMap);
      } else {
        viewMap.setView([lat, lng], 16);
        viewMarker.setLatLng([lat, lng]);
        setTimeout(() => viewMap.invalidateSize(), 100);
      }
      viewMarker.bindPopup(`<b>${title}</b><br>Pickup Spot`).openPopup();
    }

    function closeMap() {
      document.getElementById('map-modal').style.display = 'none';
    }

    // Close modal on outside click
    window.onclick = function (event) {
      const modal = document.getElementById('map-modal');
      if (event.target == modal) {
        closeMap();
      }
    }

    async function reserveDonation(id) {
      if (!confirm('Reserve this item for pickup? Please only reserve if you intend to collect it.')) return;

      try {
        const res = await fetch(`/api/donations/${id}/reserve`, {
          method: "POST",
          headers: { "x-user-id": user.email }
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Reservation failed");

        alert("Success! Check 'My Reservations' for your pickup code. 🎫");
        switchTab('reservations');
      } catch (err) {
        alert(err.message);
      }
    }

    window.addEventListener('load', loadDonations);
  </script>
</body>

</html>
