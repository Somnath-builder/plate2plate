<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Food - Plate2Plate</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/globals.css">
  <style>
    .page-header {
      background: var(--secondary);
      color: white;
      padding: var(--space-2xl) 0;
      margin-bottom: var(--space-2xl);
      border-bottom: none;
    }

    .tabs {
      display: flex;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
      border-bottom: 2px solid var(--border);
    }

    .tab {
      padding: var(--space-sm) var(--space-lg);
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--transition-normal);
      background: none;
      border: none;
      cursor: pointer;
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn var(--transition-normal) forwards;
    }

    .donation-card {
      border-top: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .donation-card.reserved-item {
      border-top-color: var(--secondary);
    }

    .donation-card.completed-item {
      border-top-color: var(--success);
    }

    .badge {
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-available {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-reserved {
      background: #fef9c3;
      color: #854d0e;
    }

    .badge-completed {
      background: #dcfce7;
      color: #166534;
    }

    .pickup-code-box {
      background: var(--primary-light);
      padding: var(--space-md);
      border-radius: var(--radius-lg);
      border: 2px dashed var(--primary);
      text-align: center;
      margin-top: var(--space-sm);
    }

    .code-display {
      font-family: 'Sora', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.25em;
      margin: var(--space-xs) 0;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="container flex items-center justify-between">
      <a href="/dashboard.html" class="flex items-center gap-sm">
        <img src="/logo.svg" alt="Logo" width="32" height="32">
        <span
          style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.25rem; color: var(--primary);">Plate2Plate</span>
      </a>
      <div class="flex items-center gap-md">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/provider.html" class="nav-link">Share Food</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1 style="font-family: 'Sora', sans-serif; margin-bottom: var(--space-xs); color: white;">Find Available Food
      </h1>
      <p style="color: rgba(255,255,255,0.8);">Browse current redistribution listings near you.</p>
    </div>
  </header>

  <main class="container" style="padding-bottom: var(--space-2xl);">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('available')">Available Feed</button>
      <button class="tab" onclick="switchTab('reservations')">My Reservations</button>
    </div>

    <!-- Available Tab -->
    <div id="available-tab" class="tab-content active">
      <div id="donations-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg">
        <!-- Populated by JS -->
        <div class="card text-center" style="grid-column: 1/-1; padding: var(--space-2xl); color: var(--text-muted);">
          <p>Scanning for available food...</p>
        </div>
      </div>
    </div>

    <!-- Reservations Tab -->
    <div id="reservations-tab" class="tab-content">
      <div id="my-reservations" class="flex flex-col gap-md">
        <!-- Populated by JS -->
        <div class="card text-center" style="padding: var(--space-2xl); color: var(--text-muted);">
          <p>Loading your reservations...</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <p>© 2026 Plate2Plate • Built for a sustainable campus</p>
    </div>
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem('plate2plate_user'));
    if (!user) window.location.href = '/auth.html';

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'available') {
        document.querySelector('[onclick="switchTab(\'available\')"]').classList.add('active');
        document.getElementById('available-tab').classList.add('active');
        loadDonations();
      } else {
        document.querySelector('[onclick="switchTab(\'reservations\')"]').classList.add('active');
        document.getElementById('reservations-tab').classList.add('active');
        loadReservations();
      }
    }

    async function loadDonations() {
      const grid = document.getElementById('donations-grid');
      try {
        const res = await fetch("/api/donations");
        const data = await res.json();

        if (!data.length) {
          grid.innerHTML = '<div class="card text-center" style="grid-column: 1/-1;"><p>Everything is currently shared! Check back later. 🥗</p></div>';
          return;
        }

        grid.innerHTML = data.map(d => `
                    <div class="card donation-card">
                        <div class="flex justify-between items-start">
                            <h3 style="margin: 0;">${d.foodName}</h3>
                            <span class="badge badge-available">Available</span>
                        </div>
                        <div style="font-size: 0.875rem; color: var(--text-muted);">
                            <p><b>Category:</b> ${d.foodCategory}</p>
                            <p><b>Quantity:</b> ${d.quantity} ${d.unit}</p>
                            <p><b>Expires:</b> ${new Date(d.expiryDate).toLocaleDateString()}</p>
                        </div>
                        <div style="margin-top: auto; padding-top: var(--space-sm); border-top: 1px solid var(--border);">
                            <p style="font-size: 0.8125rem; color: var(--text-muted); margin-bottom: var(--space-sm);">
                                📍 ${d.donorAddress || 'Local Campus Pickup'}
                            </p>
                            <button onclick="reserveDonation('${d._id}')" class="btn btn-primary" style="width: 100%;">Reserve for Pickup</button>
                        </div>
                    </div>
                `).join('');
      } catch (err) {
        grid.innerHTML = '<div class="card text-center" style="grid-column: 1/-1; color: var(--error);"><p>Failed to connect to feed.</p></div>';
      }
    }

    async function loadReservations() {
      const container = document.getElementById('my-reservations');
      try {
        const res = await fetch("/api/donations/reservations", {
          headers: { "x-user-id": user.email }
        });
        const data = await res.json();

        if (data.length === 0) {
          container.innerHTML = '<div class="card text-center"><p>You haven\'t reserved anything yet. Go browse the feed!</p></div>';
          return;
        }

        container.innerHTML = data.map(d => {
          const isCompleted = d.status === "completed";
          return `
                        <div class="card donation-card ${isCompleted ? 'completed-item' : 'reserved-item'}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 style="margin: 0;">${d.foodName}</h3>
                                    <span style="font-size: 0.875rem; color: var(--text-muted);">${d.quantity} ${d.unit} • ${d.foodCategory}</span>
                                </div>
                                <span class="badge ${isCompleted ? 'badge-completed' : 'badge-reserved'}">${d.status}</span>
                            </div>

                            <div class="grid grid-cols-2 gap-md" style="font-size: 0.875rem;">
                                <div>
                                    <p><b>Pickup From:</b> ${d.donorAddress || 'Confirmed Location'}</p>
                                    <p><b>Contact:</b> ${d.donorContact || 'See provider'}</p>
                                </div>
                                <div>
                                    <p><b>Pickup By:</b> ${new Date(d.pickupEndDate).toLocaleString()}</p>
                                </div>
                            </div>

                            ${!isCompleted ? `
                                <div class="pickup-code-box">
                                    <p style="font-size: 0.8125rem; font-weight: 600; text-transform: uppercase;">Your Pickup Code</p>
                                    <div class="code-display">${d.code || '----'}</div>
                                    <p style="font-size: 0.75rem; color: var(--text-muted);">Show this code to the provider to verify pickup.</p>
                                </div>
                            ` : `
                                <div style="color: var(--success); font-weight: 700; display: flex; align-items: center; gap: 0.5rem; margin-top: var(--space-sm);">
                                    <span>✓</span> Pickup Completed Successfully
                                </div>
                            `}
                        </div>
                    `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<div class="card text-center" style="color: var(--error);"><p>Error loading reservations.</p></div>';
      }
    }

    async function reserveDonation(id) {
      if (!confirm('Reserve this item for pickup? Please only reserve if you intend to collect it.')) return;

      try {
        const res = await fetch(`/api/donations/${id}/reserve`, {
          method: "POST",
          headers: { "x-user-id": user.email }
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Reservation failed");

        alert("Success! Check 'My Reservations' for your pickup code. 🎫");
        switchTab('reservations');
      } catch (err) {
        alert(err.message);
      }
    }

    window.addEventListener('load', loadDonations);
  </script>
</body>

</html>
