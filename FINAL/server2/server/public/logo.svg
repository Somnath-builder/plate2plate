<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#FFFBF0" opacity="0"/>
  
  <!-- Green plate -->
  <circle cx="150" cy="150" r="80" fill="#8AB86E"/>
  <circle cx="150" cy="150" r="60" fill="#FFFBF0" stroke="#0F5132" stroke-width="6"/>
  <circle cx="150" cy="150" r="40" fill="#8AB86E"/>
  
  <!-- Orange plate -->
  <circle cx="250" cy="250" r="80" fill="#FFC107"/>
  <circle cx="250" cy="250" r="60" fill="#FFFBF0" stroke="#E67E22" stroke-width="6"/>
  <circle cx="250" cy="250" r="40" fill="#FFC107"/>
  
  <!-- Simple bidirectional arrow (<->) -->
  <!-- Horizontal line -->
  <line x1="160" y1="200" x2="240" y2="200" stroke="#0F5132" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Left arrowhead -->
  <line x1="180" y1="180" x2="160" y2="200" stroke="#0F5132" stroke-width="12" stroke-linecap="round"/>
  <line x1="180" y1="220" x2="160" y2="200" stroke="#0F5132" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Right arrowhead -->
  <line x1="220" y1="180" x2="240" y2="200" stroke="#0F5132" stroke-width="12" stroke-linecap="round"/>
  <line x1="220" y1="220" x2="240" y2="200" stroke="#0F5132" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Text elements -->
  <!-- Main title -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#0F5132">Plate2Plate</text>
  
  <!-- Tagline (shifted 5% to the right) -->
  <text x="220" y="350" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#0F5132">Every Plate MATTERS</text>
</svg>